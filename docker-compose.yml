version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arenago-postgres
    restart: always
    environment:
      POSTGRES_USER: arenago_user
      POSTGRES_PASSWORD: arenago_secret_password
      POSTGRES_DB: arenago_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenago_user -d arenago_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arenago-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: arenago-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://arenago_user:arenago_secret_password@postgres:5432/arenago_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: arenago_super_jwt_secret_key_change_in_production
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: arenago-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
